services:
  postgres:
    image: postgres:15-alpine
    container_name: fashion-ecommerce-postgres
    environment:
      POSTGRES_DB: fashion_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fashion-ecommerce/database/init:/docker-entrypoint-initdb.d
    networks:
      - fashion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: fashion-ecommerce-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - fashion-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fashion-ecommerce-grafana
    ports:
      - "8080:3000"  # Grafana should be on 8080 according to the diagram
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - fashion-network
    depends_on:
      - prometheus
    restart: unless-stopped

  auth:
    build:
      context: ./fashion-ecommerce/backend/services/auth
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-auth
    ports:
      - "3002:8000"  # Changed from 8002 to 3002
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/auth_db
      - SERVICE_NAME=auth
      - SERVICE_PORT=8000
      - JWT_SECRET=your-super-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRES_IN=3600
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fashion-network
    restart: unless-stopped

  products:
    build:
      context: ./fashion-ecommerce/backend/services/products
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-products
    ports:
      - "3003:8000"  # Changed from 8003 to 3003
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/products_db
      - SERVICE_NAME=products
      - SERVICE_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fashion-network
    restart: unless-stopped

  orders:
    build:
      context: ./fashion-ecommerce/backend/services/orders
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-orders
    ports:
      - "3004:8000"  # Changed from 8004 to 3004
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/orders_db
      - SERVICE_NAME=orders
      - SERVICE_PORT=8000
      - AUTH_SERVICE_URL=http://fashion-ecommerce-auth:8000
      - PRODUCT_SERVICE_URL=http://fashion-ecommerce-products:8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fashion-network
    restart: unless-stopped


  users:
    build:
      context: ./fashion-ecommerce/backend/services/users
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-users
    ports:
      - "3005:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/users_db
      - SERVICE_NAME=users
      - SERVICE_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fashion-network
    restart: unless-stopped

  gateway:
    build:
      context: ./fashion-ecommerce/backend/services/gateway
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-gateway
    ports:
      - "3001:8000"  # Changed from 8001 to 3001
    environment:
      - SERVICE_NAME=gateway
      - SERVICE_PORT=8000
      - AUTH_URL=http://fashion-ecommerce-auth:8000
      - PRODUCTS_URL=http://fashion-ecommerce-products:8000
      - ORDERS_URL=http://fashion-ecommerce-orders:8000
      - USERS_URL=http://fashion-ecommerce-users:8000
    depends_on:
      - auth
      - products
      - orders
      - users
    networks:
      - fashion-network
    restart: unless-stopped
  
  frontend:
    build:
      context: ./fashion-ecommerce/frontend
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
    depends_on:
      - gateway
    networks:
      - fashion-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  fashion-network:
    driver: bridge