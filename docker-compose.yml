services:
  postgres:
    image: postgres:15-alpine
    container_name: fashion-ecommerce-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fashion-ecommerce/database/init:/docker-entrypoint-initdb.d
    networks:
      - fashion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # -------------------------------------------------------------------------
  # Monitoring stack
  #   * prometheus -> scrapes /metrics from every backend service (see
  #     prometheus/prometheus.yml) and from cadvisor
  #   * cadvisor   -> per-container CPU / memory metrics used by the
  #     "Ecommerce Microservices" Grafana dashboard ("Container ..." panels)
  #   * grafana    -> auto-provisions that dashboard and the Prometheus
  #     datasource (see grafana/)
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: fashion-ecommerce-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=10d'   # keep 10 days of metrics
    networks:
      - fashion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  cadvisor:
    # Publishes the container_* metrics (CPU, memory) that the
    # Dashboard's "Container ..." panels query.
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: fashion-ecommerce-cadvisor
    ports:
      - "8081:8080"        # host 8080 belongs to Grafana; 8081 is UI-only
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--docker_only=true'
    privileged: true
    networks:
      - fashion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:latest
    container_name: fashion-ecommerce-grafana
    ports:
      - "8080:3000"  # Grafana should be on 8080 according to the diagram
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/tmp/dashboards:ro   # JSON loaded by grafana/provisioning/dashboards/provider.yaml
      - grafana_data:/var/lib/grafana
    networks:
      - fashion-network
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth:
    build:
      context: ./fashion-ecommerce/backend/services/auth
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-auth
    ports:
      - "3002:8000"  # Changed from 8002 to 3002
    environment:
      - DATABASE_URL=${AUTH_DB_URL}
      - SERVICE_NAME=auth
      - SERVICE_PORT=${SERVICE_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fashion-network
    restart: unless-stopped

  products:
    build:
      context: ./fashion-ecommerce/backend/services/products
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-products
    ports:
      - "3003:8000"  # Changed from 8003 to 3003
    environment:
      - DATABASE_URL=${PRODUCTS_DB_URL}
      - SERVICE_NAME=products
      - SERVICE_PORT=${SERVICE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fashion-network
    restart: unless-stopped

  orders:
    build:
      context: ./fashion-ecommerce/backend/services/orders
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-orders
    ports:
      - "3004:8000"  # Changed from 8004 to 3004
    environment:
      - DATABASE_URL=${ORDERS_DB_URL}
      - SERVICE_NAME=orders
      - SERVICE_PORT=${SERVICE_PORT}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fashion-network
    restart: unless-stopped


  users:
    build:
      context: ./fashion-ecommerce/backend/services/users
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-users
    ports:
      - "3005:8000"
    environment:
      - DATABASE_URL=${USERS_DB_URL}
      - SERVICE_NAME=users
      - SERVICE_PORT=${SERVICE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fashion-network
    restart: unless-stopped

  gateway:
    build:
      context: ./fashion-ecommerce/backend/services/gateway
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-gateway
    ports:
      - "3001:8000"  # Changed from 8001 to 3001
    environment:
      - SERVICE_NAME=gateway
      - SERVICE_PORT=${SERVICE_PORT}
      - AUTH_URL=${AUTH_URL}
      - PRODUCTS_URL=${PRODUCTS_URL}
      - ORDERS_URL=${ORDERS_URL}
      - USERS_URL=${USERS_URL}
    depends_on:
      - auth
      - products
      - orders
      - users
    networks:
      - fashion-network
    restart: unless-stopped
  
  frontend:
    build:
      context: ./fashion-ecommerce/frontend
      dockerfile: Dockerfile
    container_name: fashion-ecommerce-frontend
    ports:
      - "80:80"
    environment:
      - GATEWAY_URL=${GATEWAY_URL}
    depends_on:
      - gateway
    networks:
      - fashion-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  fashion-network:
    driver: bridge