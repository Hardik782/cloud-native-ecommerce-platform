apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/auth:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "auth"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: AUTH_DB_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET
            - name: JWT_ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_ALGORITHM
            - name: JWT_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_EXPIRES_IN
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: ecommerce
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP