apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/orders:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "orders"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: ORDERS_DB_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: ecommerce
spec:
  selector:
    app: orders
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP