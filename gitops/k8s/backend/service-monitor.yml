apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ecommerce-services
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - ecommerce
  # Use the Service's `app` label as the Prometheus `job` label so dashboard
  # queries like `http_requests_total{job=~"gateway|auth|..."}` match correctly.
  jobLabel: app
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway
          - auth
          - products
          - orders
          - users
  endpoints:
    - port: http
      path: /metrics
      interval: 15s