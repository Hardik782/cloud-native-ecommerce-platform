apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "gateway"
            - name: AUTH_URL
              value: "http://auth:8000"
            - name: PRODUCTS_URL
              value: "http://products:8000"
            - name: ORDERS_URL
              value: "http://orders:8000"
            - name: USERS_URL
              value: "http://users:8000"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ecommerce
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP