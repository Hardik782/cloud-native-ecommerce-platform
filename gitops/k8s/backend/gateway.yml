apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: GATEWAY_SERVICE_NAME
            - name: SERVICE_PORT
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: GATEWAY_SERVICE_PORT
            - name: AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: AUTH_URL
            - name: PRODUCTS_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: PRODUCTS_URL
            - name: ORDERS_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: ORDERS_URL
            - name: USERS_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: USERS_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ecommerce
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 3001
      targetPort: 8000
  type: ClusterIP