apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/users:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "users"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: USERS_DB_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: ecommerce
spec:
  selector:
    app: users
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP