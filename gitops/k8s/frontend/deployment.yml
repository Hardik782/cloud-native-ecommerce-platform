apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ecommerce-frontend:823a40e93ecb29ddc6c51a8ba9ef568b5f0a9f73
          ports:
            - containerPort: 80
          env:
            - name: GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: GATEWAY_SERVICE_URL

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ecommerce
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP