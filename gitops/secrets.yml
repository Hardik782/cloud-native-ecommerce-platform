apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # NOTE: example/dev values only. In production manage this Secret with
  # SealedSecrets/ExternalSecrets/SOPS and never commit real credentials.
  #
  # --- PostgreSQL (gitops/k8s/database/statefulset.yml) ---
  POSTGRES_DB: fashion_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres123
  #
  # --- Per-service database connection URLs ---
  AUTH_DB_URL: postgresql://postgres:postgres123@postgres-service:5432/auth_db
  PRODUCTS_DB_URL: postgresql://postgres:postgres123@postgres-service:5432/products_db
  ORDERS_DB_URL: postgresql://postgres:postgres123@postgres-service:5432/orders_db
  USERS_DB_URL: postgresql://postgres:postgres123@postgres-service:5432/users_db
  #
  # --- Auth / JWT ---
  JWT_SECRET: change-me-in-production
  JWT_ALGORITHM: HS256
  JWT_EXPIRES_IN: "3600"
  #
  # --- Service identity (SERVICE_NAME / SERVICE_PORT per deployment) ---
  AUTH_SERVICE_NAME: auth
  AUTH_SERVICE_PORT: "8000"
  PRODUCTS_SERVICE_NAME: products
  PRODUCTS_SERVICE_PORT: "8000"
  ORDERS_SERVICE_NAME: orders
  ORDERS_SERVICE_PORT: "8000"
  USERS_SERVICE_NAME: users
  USERS_SERVICE_PORT: "8000"
  GATEWAY_SERVICE_NAME: gateway
  GATEWAY_SERVICE_PORT: "8000"
  #
  # --- Inter-service URLs (kubernetes Service DNS) ---
  AUTH_URL: http://auth:3002
  PRODUCTS_URL: http://products:3003
  ORDERS_URL: http://orders:3004
  USERS_URL: http://users:3005
  AUTH_SERVICE_URL: http://auth:3002
  PRODUCT_SERVICE_URL: http://products:3003
  #
  # --- Frontend ---
  REACT_APP_API_URL: http://gateway:3001/api